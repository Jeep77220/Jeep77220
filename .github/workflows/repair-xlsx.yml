name: Ajouter le manuel IR20

on:
  push:
    branches: [vibe/fiches-fo202-e3dd98]
    paths: ['repair.txt']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ecrire le script
        run: |
          cat > /tmp/fix.py << 'PYEOF'
          import hashlib, posixpath, re, subprocess, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET
          import zipfile, shutil, traceback
          
          XLSX = "METRO JP 1/Calendrier des étalonnages.xlsx"
          PDF = "METRO JP 1/documents/Thermomètre d'atelier IR20/Manuel Thermomètre d'atelier IR20.pdf"
          TARGET = "documents/Thermomètre d'atelier IR20/Manuel Thermomètre d'atelier IR20.pdf"
          VIEWER = "https://tmpfiles.org/wGA4axEn3QM1/manuel_ir20.pdf"
          MD5 = "be2c289af3790110f91163f4ff481541"
          M = '{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
          R = '{http://schemas.openxmlformats.org/officeDocument/2006/relationships}'
          
          # telechargement robuste : on extrait le lien direct depuis la page
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              return urllib.request.urlopen(req, timeout=120).read()
          
          data = None
          try:
              data = get("https://tmpfiles.org/dl/1795691633.babc5588f0b816a5/wGA4axEn3QM1/manuel_ir20.pdf")
          except Exception as e:
              print("direct KO:", e)
          try:
              if not data or not data.startswith(b'%PDF'):
                  page = get(VIEWER).decode("utf-8", "replace")
                  m = re.search(r'href="(https://tmpfiles\.org/dl/[^"]+)"', page)
                  print("lien direct extrait:", m and m.group(1))
                  if m:
                      data = get(m.group(1))
          except Exception as e:
              print("viewer KO:", e)
          
          assert data and data.startswith(b'%PDF'), "PDF non recupere"
          open(PDF, "wb").write(data)
          h = hashlib.md5(data).hexdigest()
          print("md5:", h, "taille:", len(data))
          assert h == MD5, "PDF corrompu"
          
          # modifier le classeur : J3 devient un lien vers le manuel
          z = zipfile.ZipFile(XLSX)
          sh_raw = z.read("xl/worksheets/sheet1.xml").decode("utf-8")
          rels_raw = z.read("xl/worksheets/_rels/sheet1.xml.rels").decode("utf-8")
          mstyle = re.search(r'<c r="J4" s="([0-9]+)"', sh_raw)
          style_j4 = mstyle.group(1)
          newcell = '<c r="J3" s="' + style_j4 + '" t="inlineStr"><is><t>Manuel Thermomètre IR20</t></is></c>'
          sh_raw2, n = re.subn(r'<c r="J3"[^>]*>.*?</c>', newcell, sh_raw, count=1, flags=re.S)
          assert n == 1, "J3 introuvable"
          ids = [int(m.group(1)) for m in re.finditer(r'Id="rId([0-9]+)"', rels_raw)]
          new_id = "rId" + str(max(ids) + 1)
          rel_entry = '<Relationship Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + TARGET + '" TargetMode="External" Id="' + new_id + '"/>'
          rels_raw2 = rels_raw.replace("</Relationships>", rel_entry + "</Relationships>")
          hl = '<hyperlink ref="J3" r:id="' + new_id + '"/>'
          if "</hyperlinks>" in sh_raw2:
              sh_raw2 = sh_raw2.replace("</hyperlinks>", hl + "</hyperlinks>", 1)
          else:
              sh_raw2 = sh_raw2.replace("</worksheet>", "<hyperlinks>" + hl + "</hyperlinks>")
          
          tmp = "/tmp/fixed.xlsx"
          with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
              for item in z.infolist():
                  data2 = z.read(item.filename)
                  if item.filename == "xl/worksheets/sheet1.xml":
                      data2 = sh_raw2.encode("utf-8")
                  elif item.filename == "xl/worksheets/_rels/sheet1.xml.rels":
                      data2 = rels_raw2.encode("utf-8")
                  zout.writestr(item, data2)
          
          paths = subprocess.check_output(["git", "-c", "core.quotepath=false", "ls-tree", "-r", "--name-only", "HEAD"]).decode("utf-8").splitlines()
          paths.append(PDF)
          pathset = set(paths)
          z2 = zipfile.ZipFile(tmp)
          relsv = ET.fromstring(z2.read("xl/worksheets/_rels/sheet1.xml.rels"))
          relmapv = {r.get("Id"): r.get("Target") for r in relsv}
          shv = ET.fromstring(z2.read("xl/worksheets/sheet1.xml"))
          ok = bad = 0
          for h in shv.iter(M + "hyperlink"):
              tgt2 = relmapv.get(h.get(R + "id")) or h.get("location")
              full = posixpath.normpath(posixpath.join("METRO JP 1", tgt2))
              if urllib.parse.unquote(full) in pathset or full in pathset:
                  ok += 1
              else:
                  bad += 1
                  print("CASSE:", h.get("ref"), tgt2)
          print("liens valides:", ok, "| casses:", bad)
          assert bad == 0, "liens casses"
          assert ok == 66, "attendu 66 liens, obtenu " + str(ok)
          shutil.copy(tmp, XLSX)
          PYEOF
      - name: Diagnostiquer et publier
        run: |
          set +e
          python3 /tmp/fix.py > /tmp/diag.txt 2>&1
          E=$?
          cat /tmp/diag.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/diag.txt diag.txt
          git add diag.txt
          git commit -m "Diagnostic manuel IR20"
          git push origin HEAD:refs/heads/diag2 --force
          if [ "$E" = "0" ]; then
            git add "METRO JP 1/documents/Thermomètre d'atelier IR20/Manuel Thermomètre d'atelier IR20.pdf" "METRO JP 1/Calendrier des étalonnages.xlsx"
            git commit --amend -m "Manuel Thermometre IR20 : ajout et lien dans le calendrier (66/66 valides)"
            git push origin HEAD:vibe/fiches-fo202-e3dd98
          fi
          exit $E
