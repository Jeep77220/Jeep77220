name: Generer les trames vierges + colonnes K/L

on:
  push:
    branches: [vibe/fiches-fo202-e3dd98]
    paths: ['repair.txt']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer python-docx
        run: pip install --quiet python-docx
      - name: Ecrire le script
        run: |
          cat > /tmp/fix.py << 'PYEOF'
          import os, posixpath, re, shutil, subprocess, sys, zipfile
          import xml.etree.ElementTree as ET
          from docx import Document
          from docx.shared import Pt
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          
          BASE = "METRO JP 1"
          XLSX = "METRO JP 1/Calendrier des étalonnages.xlsx"
          FO202D = "fiches pré-remplies"
          M = "{http://schemas.openxmlformats.org/spreadsheetml/2006/main}"
          R = "{http://schemas.openxmlformats.org/officeDocument/2006/relationships}"
          
          ROWS = [
              (3, "Thermomètre d'atelier IR20", "FO 202 ind A - fiche de suivi - Thermomètre - IR2000281-IR2000300.docx", "IR20"),
              (4, "Palmer Mitutoyo 8074960", "FO 202 ind A - fiche de suivi - Palmer (atelier) - 8074960 - 102217.docx", "8074960"),
              (5, "Pied à coulisse  Mitutoyo 7001574", "FO 202 ind A - fiche de suivi - Pied à Coulisse numérique (atelier) - 7001574.docx", "7001574"),
              (6, "Positector 163214", "FO 202 ind A - fiche de suivi - Mesureur d'épaisseur US (bureau AQ) - 163214.docx", "163214"),
              (7, "Rugosimètre RT-10", "FO 202 ind A - fiche de suivi - Rugosimètre (bureau AQ) - 93.docx", "RT10-93"),
              (8, "Palmer Filetta IP54 120296618", "FO 202 ind A - fiche de suivi - Micromètre numérique (atelier) - 120296618.docx", "120296618"),
              (9, "Pied à coulisse 021", "FO 202 ind A - fiche de suivi - Pied à coulisse 1000mm (bureau AQ) - 21.docx", "21"),
              (10, "SDAT HARTIP 3000", "FO 202 ind A - fiche de suivi - Mesureur de dureté  (bureau AQ) - E14060023.docx", "E14060023"),
              (11, "Luxmètre TROTEC BF06", "FO 202 ind A - fiche de suivi - Luxmètre (bureau AQ) - 211222692.docx", "211222692"),
              (12, "Mesureur de perméabilité magnétique FERROMASTER 657.2014", "FO 202 ind A - fiche de suivi - Perméabilité magnétique - 657.2014.docx", "657.2014"),
              (13, "Mètre ruban M1", "FO 202 ind A - fiche de suivi - Mètre Ruban (atelier) - M1.docx", "M1"),
              (14, "Mètre ruban M2", "FO 202 ind A - fiche de suivi - Mètre Ruban (atelier) - 33-728.docx", "M2"),
              (15, "Mètre ruban M3", "FO 202 ind A - fiche de suivi - Mètre Ruban (atelier) - 33-194.docx", "M3"),
              (16, "Mètre ruban M5", "FO 202 ind A - fiche de suivi - Mètre Ruban (atelier) - M5 8 mètres.docx", "M5"),
              (17, "Mètre ruban M6", "FO 202 ind A - fiche de suivi - Mètre Ruban (atelier) - M6 10 mètres.docx", "M6"),
              (18, "Mètre Lazer Bosh 224427088", "FO 202 ind A - fiche de suivi - Mètre laser (atelier) - 224427088.docx", "224427088"),
              (19, "Mètre étalon E1", "FO 202 ind A - fiche de suivi - Mètre Etalon (bureau AQ) - E1.docx", "E1"),
              (20, "Pied à coulisse ASIMETO 161039537", "FO 202 ind A - fiche de suivi - Pied à Coulisse numérique - 161039537.docx", "161039537"),
              (21, "Jauge de profondeur 814", "FO 202 ind A - fiche de suivi - Jauge de profondeur - 814.docx", "814"),
              (22, "Pied à coulisse   stainless-hardened I-75671", "FO 202 ind A - fiche de suivi - Pied à Coulisse numérique - I-75671.docx", "I-75671"),
              (23, "Pied à coulisse BB01684", "FO 202 ind A - fiche de suivi - Pied à Coulisse numérique - BB01684.docx", "BB01684"),
              (24, "Pied à coulisse BLET GX22033852", "FO 202 ind A - fiche de suivi - Pied à Coulisse numérique - GX22033852.docx", "GX22033852"),
              (25, "Pied à coulisse BLET 500 SN P2210310007", "FO 202 ind A - fiche de suivi - Pied à Coulisse numérique - P2210310007.docx", "P2210310007"),
              (26, "Thermohygromètre TC100 SN 2307129", "FO 202 ind A - fiche de suivi - Thermohygromètre - 2307129.docx", "2307129"),
              (27, "Etalonnage des cales étalons", "FO 202 ind A - fiche de suivi - Cales étalons - 61138.docx", "61138"),
              (28, "Rugosimètre RT-10", "FO 202 ind A - fiche de suivi - Cales étalons pour rugosiomètre (RT10) - 2817.docx", "2817"),
          ]
          
          def blank_suivi(src, dst):
              zin = zipfile.ZipFile(src)
              doc = zin.read("word/document.xml").decode("utf-8")
              def fix_tbl(m):
                  t = m.group(0)
                  parts = list(re.finditer("<w:tr[ >].*?</w:tr>", t, re.S))
                  if not parts:
                      return t
                  first_ts = re.findall("<w:t[^>]*>([^<]*)</w:t>", parts[0].group(0))
                  if "Date intervention" not in " ".join(first_ts):
                      return t
                  BLANK = lambda m2: m2.group(1) + m2.group(2)
                  blanked = [parts[0].group(0)] + [re.sub("(<w:t[^>]*>)[^<]*(</w:t>)", BLANK, q.group(0)) for q in parts[1:]]
                  return t[:parts[0].start()] + "".join(blanked) + t[parts[-1].end():]
              doc2 = re.sub("<w:tbl>.*?</w:tbl>", fix_tbl, doc, flags=re.S)
              if doc2 == doc:
                  raise SystemExit("table interventions introuvable dans " + src)
              with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zout:
                  for it in zin.infolist():
                      data = zin.read(it.filename)
                      if it.filename == "word/document.xml":
                          data = doc2.encode("utf-8")
                      zout.writestr(it, data)
          
          def gen_317(ident, dest):
              doc = Document()
              st = doc.styles["Normal"]
              st.font.name = "Calibri"
              st.font.size = Pt(10)
              h = doc.add_heading("RELEVE D’ETALONNAGE - FO 317", 0)
              h.alignment = WD_ALIGN_PARAGRAPH.CENTER
              sub = doc.add_paragraph("Trame vierge - à remplir à chaque étalonnage / vérification")
              sub.alignment = WD_ALIGN_PARAGRAPH.CENTER
              t = doc.add_table(rows=5, cols=2)
              t.style = "Table Grid"
              labels = ["Désignation de l’instrument", "Fabricant", "Référence fabricant", "Numéro de série", "Périodicité d’étalonnage"]
              for i, lab in enumerate(labels):
                  c0 = t.cell(i, 0); c1 = t.cell(i, 1)
                  c0.text = lab
                  c0.paragraphs[0].runs[0].bold = True
                  c1.text = ident[i]
              doc.add_heading("Informations de l’intervention", 1)
              t2 = doc.add_table(rows=4, cols=2)
              t2.style = "Table Grid"
              labs2 = ["Rapport n° (n° de série - année)", "Date d’intervention", "Réalisé par", "Étalons de référence utilisés (n° + validité)"]
              for i, lab in enumerate(labs2):
                  c0 = t2.cell(i, 0); c0.text = lab
                  c0.paragraphs[0].runs[0].bold = True
              doc.add_heading("Examen visuel", 1)
              t3 = doc.add_table(rows=6, cols=3)
              t3.style = "Table Grid"
              pts = ["Propreté / état général", "Aucun choc / déformation visible", "Affichage / zéro cohérent", "Becs / pointes / jonction en bon état", "Alimentation / accessoires conformes"]
              for j, lab in enumerate(["Point de contrôle", "Conforme (Oui / Non)", "Observations"]):
                  c0 = t3.cell(0, j); c0.text = lab
                  c0.paragraphs[0].runs[0].bold = True
              for i, pt in enumerate(pts, start=1):
                  t3.cell(i, 0).text = pt
              doc.add_heading("Relevé de mesures", 1)
              t4 = doc.add_table(rows=9, cols=5)
              t4.style = "Table Grid"
              for j, lab in enumerate(["Point de mesure", "Valeur de référence (étalon)", "Indication de l’instrument", "Écart", "Conforme (Oui / Non)"]):
                  c0 = t4.cell(0, j); c0.text = lab
                  c0.paragraphs[0].runs[0].bold = True
              doc.add_heading("Conclusion", 1)
              doc.add_paragraph("État métrologique : CONFORME / NON CONFORME (rayer la mention inutile)")
              doc.add_paragraph("Date limite de validité : ____________________")
              t5 = doc.add_table(rows=3, cols=3)
              t5.style = "Table Grid"
              for j, lab in enumerate(["", "Nom", "Date et visa"]):
                  if lab:
                      c0 = t5.cell(0, j); c0.text = lab
                      c0.paragraphs[0].runs[0].bold = True
              for i, w in enumerate(["Réalisé par", "Validé par"]):
                  c0 = t5.cell(i + 1, 0); c0.text = w
                  c0.paragraphs[0].runs[0].bold = True
              doc.save(dest)
          
          zx = zipfile.ZipFile(XLSX)
          shx = zx.read("xl/worksheets/sheet1.xml").decode("utf-8")
          shE = ET.fromstring(shx.encode("utf-8"))
          identByRow = {}
          for row in shE.iter(M + "row"):
              rn = int(row.get("r"))
              if rn < 3 or rn > 28:
                  continue
              vals = {}
              for c in row:
                  col = re.match("[A-Z]+", c.get("r")).group(0)
                  is_ = c.find(M + "is")
                  if is_ is not None:
                      vals[col] = "".join(t2.text or "" for t2 in is_.iter(M + "t"))
              identByRow[rn] = [vals.get("A", ""), vals.get("B", ""), vals.get("C", ""), vals.get("D", ""), vals.get("E", "")]
          
          changed = []
          for (rn, folder, src_name, tid) in ROWS:
              tr_suivi = os.path.join(BASE, "documents", folder, "TRAME - Fiche de suivi vierge - " + tid + ".docx")
              tr_317 = os.path.join(BASE, "documents", folder, "TRAME - Releve etalonnage vierge - " + tid + ".docx")
              blank_suivi(os.path.join(FO202D, src_name), tr_suivi)
              gen_317(identByRow[rn], tr_317)
              changed += [tr_suivi, tr_317]
          print("trames generees :", len(changed))
          
          for f in [c for c in changed if "Fiche de suivi" in c]:
              zz = zipfile.ZipFile(f)
              xx = zz.read("word/document.xml").decode("utf-8")
              texts = "".join(re.findall("<w:t[^>]*>([^<]*)</w:t>", xx))
              assert not re.search("(19|20)[0-9]{2}/[0-9]{2}/[0-9]{2}", texts), "date residuelle dans " + f
              assert xx.count("<w:tbl>") >= 2, "tables manquantes dans " + f
          print("verification fiches de suivi : OK")
          
          rels = zx.read("xl/worksheets/_rels/sheet1.xml.rels").decode("utf-8")
          max_id = max(int(m.group(1)) for m in re.finditer('Id="rId([0-9]+)"', rels))
          new_rels = ""
          hls = ""
          nid = max_id
          RNS = 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"'
          for (rn, folder, src_name, tid) in ROWS:
              for col, label in (("K", "Fiche de suivi"), ("L", "Releve etalonnage")):
                  fname = "TRAME - " + label + " vierge - " + tid + ".docx"
                  target = "documents/" + folder + "/" + fname
                  assert os.path.exists(os.path.join(BASE, target)), "trame absente : " + target
                  nid += 1
                  rid = "rId" + str(nid)
                  new_rels += '<Relationship Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + target + '" TargetMode="External" Id="' + rid + '"/>'
                  hls += '<hyperlink ' + RNS + ' ref="' + col + str(rn) + '" r:id="' + rid + '"/>'
          
          shx = shx.replace('<dimension ref="A1:J28" />', '<dimension ref="A1:L28" />')
          shx = shx.replace('ref="A1:J1"', 'ref="A1:L1"')
          shx = shx.replace("</cols>", '<col width="17" customWidth="1" min="11" max="12" /></cols>')
          assert "A1:L28" in shx and "A1:L1" in shx, "dimension/merge non remplaces"
          
          def cxml(ref, style, text):
              return '<c r="' + ref + '" s="' + style + '" t="inlineStr"><is><t>' + text + '</t></is></c>'
          
          hdrs = cxml("K2", "2", "Trame fiche de suivi (vierge)") + cxml("L2", "2", "Trame relevé d’étalonnage (vierge)")
          m2 = re.search(r'(<row r="2"[^>]*>)(.*?)(</row>)', shx, re.S)
          assert m2, "ligne 2 introuvable"
          shx = shx[:m2.start()] + m2.group(1) + m2.group(2) + hdrs + m2.group(3) + shx[m2.end():]
          
          for (rn, folder, src_name, tid) in ROWS:
              cells = cxml("K" + str(rn), "4", "Ouvrir la trame") + cxml("L" + str(rn), "4", "Ouvrir la trame")
              pat = re.compile(r'(<row r="' + str(rn) + r'"[^>]*>)(.*?)(</row>)', re.S)
              mm = pat.search(shx)
              assert mm, "ligne " + str(rn) + " introuvable"
              shx = shx[:mm.start()] + mm.group(1) + mm.group(2) + cells + mm.group(3) + shx[mm.end():]
          
          shx = shx.replace("</hyperlinks>", hls + "</hyperlinks>")
          rels = rels.replace("</Relationships>", new_rels + "</Relationships>")
          
          tmp = "/tmp/fixed.xlsx"
          with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
              for it in zx.infolist():
                  data = zx.read(it.filename)
                  if it.filename == "xl/worksheets/sheet1.xml":
                      data = shx.encode("utf-8")
                  elif it.filename == "xl/worksheets/_rels/sheet1.xml.rels":
                      data = rels.encode("utf-8")
                  zout.writestr(it, data)
          
          paths = subprocess.check_output(["git", "-c", "core.quotepath=false", "ls-files", "--cached", "--others", "--exclude-standard"]).decode("utf-8").splitlines()
          pathset = set(paths)
          z2 = zipfile.ZipFile(tmp)
          relsv = ET.fromstring(z2.read("xl/worksheets/_rels/sheet1.xml.rels"))
          relmap = {r.get("Id"): r.get("Target") for r in relsv}
          shv = ET.fromstring(z2.read("xl/worksheets/sheet1.xml"))
          ok = bad = 0
          for h in shv.iter(M + "hyperlink"):
              tgt = relmap.get(h.get(R + "id")) or h.get("location")
              full = posixpath.normpath(posixpath.join(BASE, tgt))
              if full in pathset:
                  ok += 1
              else:
                  bad += 1
                  print("CASSE:", h.get("ref"), tgt)
          print("liens valides:", ok, "| casses:", bad)
          assert bad == 0, "liens casses"
          assert ok == 118, "attendu 118 liens (66 + 52), obtenu " + str(ok)
          shutil.copy(tmp, XLSX)
          print("XLSX mis a jour : colonnes K et L, 118 liens valides")
          PYEOF
      - name: Diagnostiquer et publier
        run: |
          set +e
          python3 /tmp/fix.py > /tmp/diag.txt 2>&1
          E=$?
          cat /tmp/diag.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/diag.txt diag.txt
          git add diag.txt
          git commit -m "Diagnostic trames"
          git push origin HEAD:refs/heads/diag2 --force
          if [ "$E" = "0" ]; then
            git add -A "METRO JP 1/documents"
            git add "METRO JP 1/Calendrier des étalonnages.xlsx"
            git commit --amend -m "Trames vierges par instrument (FO 202 suivi + FO 317 etalonnage) + colonnes K/L du calendrier"
            git push origin HEAD:vibe/fiches-fo202-e3dd98
          fi
          exit $E
