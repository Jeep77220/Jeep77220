name: Correction format date

on:
  push:
    branches: [vibe/fiches-fo202-e3dd98]
    paths: ['repair.txt']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ecrire le script
        run: |
          cat > /tmp/fix.py << 'PYEOF'
          import re, shutil, zipfile
          XLSX = "METRO JP 1/Calendrier des étalonnages.xlsx"
          zx = zipfile.ZipFile(XLSX)
          stx = zx.read("xl/styles.xml").decode("utf-8")
          assert 'numFmtId="164"' in stx, "style date absent"
          OLD = '<numFmts count="0" />'
          NEW = '<numFmts count="1"><numFmt formatCode="DD/MM/YYYY" numFmtId="164" /></numFmts>'
          assert OLD in stx, "numFmts vide introuvable"
          stx2 = stx.replace(OLD, NEW, 1)
          assert 'DD/MM/YYYY' in stx2
          tmp = "/tmp/fixed.xlsx"
          with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
              for it in zx.infolist():
                  data = zx.read(it.filename)
                  if it.filename == "xl/styles.xml":
                      data = stx2.encode("utf-8")
                  zout.writestr(it, data)
          import xml.etree.ElementTree as ET
          z2 = zipfile.ZipFile(tmp)
          ET.fromstring(z2.read("xl/styles.xml"))
          print("numFmt date corrige : OK")
          shutil.copy(tmp, XLSX)
          PYEOF
      - name: Corriger et publier
        run: |
          set +e
          python3 /tmp/fix.py > /tmp/diag.txt 2>&1
          E=$?
          cat /tmp/diag.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/diag.txt diag.txt
          git add diag.txt
          git commit -m "Diagnostic numFmt"
          git push origin HEAD:refs/heads/diag2 --force
          if [ "$E" = "0" ]; then
            git add "METRO JP 1/Calendrier des étalonnages.xlsx"
            git commit --amend -m "Calendrier : ajout du format de date JJ/MM/AAAA pour colonnes F et G"
            git push origin HEAD:vibe/fiches-fo202-e3dd98
          fi
          exit $E
