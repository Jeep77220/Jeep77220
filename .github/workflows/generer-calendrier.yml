name: Generer le calendrier des etalonnages (Excel)

on:
  push:
    branches: [vibe/fiches-fo202-e3dd98]
    paths: ['METRO JP 1/calendrier_data.json']

permissions:
  contents: write

jobs:
  generer-xlsx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire le classeur Excel
        run: |
          pip install --quiet openpyxl
          python3 - << 'PY'
          import json
          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill, Border, Side, Alignment
          from openpyxl.utils import get_column_letter

          BASE_FICHES = '../fiches pré-remplies/'

          with open('METRO JP 1/calendrier_data.json', encoding='utf-8') as f:
              rows = json.load(f)

          wb = Workbook()
          ws = wb.active
          ws.title = "Calendrier d'etalonnage J-P"
          for r in rows:
              ws.append([str(c) if c is not None else None for c in r])

          ncols = max(len(r) for r in rows)
          ws.merge_cells(start_row=1, start_column=1, end_row=1, end_column=ncols)
          ws['A1'].font = Font(bold=True, size=14)
          ws['A1'].alignment = Alignment(horizontal='center')
          header_fill = PatternFill('solid', fgColor='1F4E78')
          thin = Side(style='thin')
          border = Border(left=thin, right=thin, top=thin, bottom=thin)
          for c in range(1, ncols + 1):
              cell = ws.cell(row=2, column=c)
              cell.font = Font(bold=True, color='FFFFFF')
              cell.fill = header_fill
              cell.alignment = Alignment(horizontal='center', wrap_text=True)
          link_font = Font(color='0563C1', underline='single')
          for r in range(3, ws.max_row + 1):
              fc = ws.cell(row=r, column=ncols)
              if fc.value:
                  fc.hyperlink = BASE_FICHES + fc.value
                  fc.value = 'Ouvrir la fiche'
                  fc.font = link_font
                  fc.alignment = Alignment(horizontal='center', vertical='center')
          for row in ws.iter_rows(min_row=2, max_row=ws.max_row, max_col=ncols):
              for cell in row:
                  cell.border = border
                  if cell.row > 2:
                      cell.alignment = Alignment(vertical='center', wrap_text=True)
          widths = [38, 20, 24, 22, 14, 16, 22, 16]
          for i, w in enumerate(widths[:ncols], start=1):
              ws.column_dimensions[get_column_letter(i)].width = w
          ws.freeze_panes = 'A3'
          wb.save('METRO JP 1/Calendrier des étalonnages.xlsx')
          print('Classeur genere')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch "METRO JP 1/Calendrier des etalonnages.xlsx"
          git add "METRO JP 1/Calendrier des étalonnages.xlsx"
          git commit -m "Calendrier des etalonnages : liens locaux vers les fiches FO 202 du dossier fiches pre-remplies" || echo "aucun changement"
          git push
